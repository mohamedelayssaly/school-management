{% extends 'accounts/base.html' %}
{% block title %}My account{% endblock %}
{% block content %}
<h2>My account</h2>
<form method='post' class='panel narrow'>
  {% csrf_token %}
  <p class='muted'>Signed in as <strong>{{ user.username }}</strong> ({{ user.get_role_display|default:'Administrator' }}).</p>
  {{ form.as_p }}
  <div class='form-actions'>
    <button type='submit'>Save details</button>
    <a class='btn btn-ghost' href='{% url 'my_password' %}'>Change my password</a>
  </div>
</form>
{% endblock %}
