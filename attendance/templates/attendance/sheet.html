{% extends 'accounts/base.html' %}
{% block content %}
<h2>Attendance: {{ school_class.name }}</h2>
<form method='get'>
  <input type='date' name='date' value='{{ day|date:'Y-m-d' }}'>
  <button type='submit'>Show day</button>
</form>
<form method='post'>
  {% csrf_token %}
  <input type='hidden' name='date' value='{{ day|date:'Y-m-d' }}'>
  <table>
    <tr><th>Student</th><th>Status</th><th>Note</th></tr>
    {% for row in rows %}
    <tr>
      <td>{{ row.student }}</td>
      <td>
        <select name='status_{{ row.student.pk }}'>
          {% for value, label in statuses %}
          <option value='{{ value }}' {% if row.status == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </td>
      <td><input type='text' name='note_{{ row.student.pk }}' value='{{ row.note }}' maxlength='200'></td>
    </tr>
    {% empty %}
    <tr><td colspan='3'>No students are enrolled in this class.</td></tr>
    {% endfor %}
  </table>
  <div class='form-actions'>
    <button type='submit'>Save attendance for {{ day }}</button>
    <a class='btn btn-ghost' href='{% url 'teacher_dashboard' %}'>Back</a>
  </div>
</form>
{% endblock %}
