{% extends 'accounts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method='post' class='panel narrow' {% if form.is_multipart %}enctype='multipart/form-data'{% endif %}>
  {% csrf_token %}
  {{ form.as_p }}
  <div class='form-actions'>
    <button type='submit'>Save</button>
    <a class='btn btn-ghost' href='{{ back_url }}'>Cancel</a>
  </div>
</form>
{% endblock %}
